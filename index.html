<!DOCTYPE html>
<html lang="id" class="antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistem Absensi Kelas - Login untuk siswa, guru, dan admin">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <title>Login - Sistem Absensi Kelas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="shared/styles.css">
    <script src="shared/theme.js"></script>
</head>

<body
    class="bg-surface-dim dark:bg-surface-dark-dim min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-900 dark:text-slate-100 transition-colors duration-300 font-sans"
    x-data="{ isDark: false }" x-init="ThemeUtil.init($data)" :class="{ 'dark': isDark }">

    <!-- Mobile Layout Container (Narrow max-width kept for layout focus, allowed to scroll naturally) -->
    <div class="w-full max-w-[400px] flex flex-col space-y-6 transition-colors duration-300">

        <!-- Header Actions (Theme toggle remains easily accessible) -->
        <div class="flex justify-between items-center w-full">
            <div class="text-[10px] font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase">
                Presensi Online
            </div>

            <button @click="ThemeUtil.toggle($data)"
                class="p-2 rounded-full bg-white dark:bg-slate-900 shadow-sm border border-slate-200/60 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all duration-200">
                <svg x-show="!isDark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-slate-900">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                </svg>
                <svg x-show="isDark" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-yellow-300">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                </svg>
            </button>
        </div>

        <div class="flex flex-col space-y-6">
            <!-- Logo & Header -->
            <div class="text-center transform hover:scale-105 transition-transform duration-300">
                <div
                    class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-primary to-primary/80 text-white mb-4 shadow-[0_12px_24px_-8px_rgba(9,76,178,0.3)] shadow-primary/20">
                    <!-- document_scanner Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                        stroke="currentColor" class="w-7 h-7 text-white">
                        <!-- Corners of scan frame -->
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 7V5a2 2 0 012-2h2m10 0h2a2 2 0 012 2v2m0 10v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2" />
                        <!-- Document Sheet -->
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M7 8a1 1 0 011-1h8a1 1 0 011 1v8a1 1 0 01-1 1H8a1 1 0 01-1-1V8z" />
                        <!-- Inside text lines -->
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 10h4m-4 3h4" />
                        <!-- Horizontal Laser Scanner Line (Red) -->
                        <path stroke-linecap="round" stroke-linejoin="round" stroke="#ef4444" stroke-width="2.2"
                            d="M4 12h16" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-800 dark:text-slate-100 font-serif">Sistem
                    Kehadiran Siswa</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">SMK Negeri 1 Sarirejo</p>
            </div>

            <!-- Login Form (Tailored form box matches dark/light mode beautifully) -->
            <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-slate-200/50 dark:border-slate-800/80 transition-all duration-300"
                x-data="loginForm()">

                <form @submit.prevent="handleLogin" class="space-y-4">
                    <!-- Error Message -->
                    <div x-show="error" x-transition style="display: none;"
                        class="bg-red-50 dark:bg-red-500/20 text-red-600 dark:text-red-300 p-3 rounded-xl text-xs border border-red-100 dark:border-red-500/30 flex items-start gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-4 h-4 flex-shrink-0 mt-0.5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <span x-text="error" class="text-[11px] leading-tight"></span>
                    </div>

                    <!-- Info auto-detect -->
                    <div
                        class="bg-blue-50 dark:bg-blue-950/20 text-blue-700 dark:text-blue-300 p-3 rounded-xl text-[11px] leading-relaxed border border-blue-100 dark:border-blue-900/30">
                        💡 Login khusus Guru dan Staff. Masukkan <strong>Username</strong> (guru/admin/operator). Login portal siswa dinonaktifkan.
                    </div>

                    <div>
                        <label class="block text-xs font-semibold mb-1.5 text-slate-700 dark:text-slate-300 font-label"
                            for="identifier">Username</label>
                        <input type="text" id="identifier" x-model="identifier"
                            class="w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-100 text-sm placeholder-slate-400 dark:placeholder-slate-600"
                            placeholder="Masukkan username" required>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold mb-1.5 text-slate-700 dark:text-slate-300 font-label"
                            for="password">Password</label>
                        <div class="relative">
                            <input :type="showPassword ? 'text' : 'password'" id="password" x-model="password"
                                class="w-full pl-3 pr-10 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-100 text-sm placeholder-slate-400 dark:placeholder-slate-600"
                                placeholder="Masukkan password" required>
                            <button type="button" @click="showPassword = !showPassword"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                                <svg x-show="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
                                    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <svg x-show="showPassword" style="display: none;" xmlns="http://www.w3.org/2000/svg"
                                    fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                                    class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" :disabled="isLoading"
                        class="w-full py-2.5 px-4 bg-gradient-to-r from-primary to-primary/80 hover:from-primary/90 hover:to-primary text-white font-semibold rounded-xl transition-all duration-200 transform hover:translate-y-[-1px] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-slate-900 flex justify-center items-center gap-2 border border-primary/30 text-sm mt-2">
                        <span x-show="!isLoading">Masuk</span>
                        <span x-show="isLoading" style="display: none;">
                            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-current inline"
                                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                            Memproses...
                        </span>
                    </button>

                    <div class="mt-4 text-center">
                        <p class="text-sm text-slate-500 dark:text-slate-400">
                            Lupa sandi? <a href="#"
                                @click.prevent="alert('Mohon hubungi Guru atau Admin untuk mengatur ulang sandi Anda.')"
                                class="text-primary hover:underline font-medium">Hubungi Admin</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>

        <p class="text-center text-[10px] text-slate-400 dark:text-slate-500 mt-4">
            &copy; 2026 Sistem Kehadiran Siswa. All rights reserved.
        </p>
    </div>

    <!-- Firebase Module -->
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";
        import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

        // Fungsi untuk menentukan role dari email Firebase Auth
        function getRoleFromEmail(email) {
            if (email.endsWith('@guru.absensi.id')) return 'guru';
            if (email.endsWith('@admin.absensi.id')) return 'admin';
            if (email.endsWith('@operator.absensi.id')) return 'operator';
            return null;
        }

        // Redirect berdasarkan role
        function redirectByRole(role) {
            const basePath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
            const routes = {
                'guru': basePath + '/pages/teacher_dashboard.html',
                'admin': basePath + '/pages/admin_dashboard.html',
                'operator': basePath + '/pages/admin_dashboard.html'
            };
            if (routes[role]) window.location.href = routes[role];
        }

        // Cek jika sudah login → auto redirect
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const role = getRoleFromEmail(user.email);
                if (role) redirectByRole(role);
            }
        });

        // Auto-detect login: coba semua format email sampai berhasil
        window.firebaseAutoLogin = async function (identifier, password) {
            const emailFormats = [
                `${identifier}@guru.absensi.id`,
                `${identifier}@admin.absensi.id`,
                `${identifier}@operator.absensi.id`
            ];

            for (const email of emailFormats) {
                try {
                    const cred = await signInWithEmailAndPassword(auth, email, password);
                    const role = getRoleFromEmail(email);

                    // Ambil data profil dari koleksi yang sesuai
                    let nama = identifier;
                    const userDoc = await getDoc(doc(db, 'users', cred.user.uid));
                    if (userDoc.exists()) nama = userDoc.data().nama;

                    // Simpan ke localStorage untuk akses cepat
                    localStorage.setItem('role', role);
                    localStorage.setItem('user_name', nama);
                    localStorage.setItem('user_uid', cred.user.uid);

                    return { role, nama };
                } catch (e) {
                    // Jika user-not-found atau invalid-credential, coba format berikutnya
                    if (e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found') {
                        continue;
                    }
                    // Error lain (terlahu banyak percobaan, network, dll) → langsung throw
                    throw e;
                }
            }

            // Semua format gagal
            throw { code: 'auth/invalid-credential' };
        };
    </script>

    <script>
        function loginForm() {
            return {
                identifier: '',
                password: '',
                showPassword: false,
                error: '',
                isLoading: false,

                async handleLogin() {
                    this.error = '';
                    this.isLoading = true;

                    try {
                        const result = await window.firebaseAutoLogin(this.identifier, this.password);

                        // Redirect berdasarkan role yang terdeteksi otomatis
                        const basePath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
                        const routes = {
                            'guru': basePath + '/pages/teacher_dashboard.html',
                            'admin': basePath + '/pages/admin_dashboard.html',
                            'operator': basePath + '/pages/admin_dashboard.html'
                        };
                        window.location.href = routes[result.role];

                    } catch (e) {
                        if (e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password') {
                            this.error = 'NISN/Username atau password salah. Pastikan data sudah di-seed.';
                        } else if (e.code === 'auth/too-many-requests') {
                            this.error = 'Terlalu banyak percobaan gagal. Tunggu beberapa menit.';
                        } else {
                            this.error = e.message || 'Terjadi kesalahan saat login';
                        }
                        this.isLoading = false;
                    }
                }
            }
        }
    </script>
</body>

</html>
