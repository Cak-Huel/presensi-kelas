                </button>
            </div>

            <nav class="p-4 space-y-2 overflow-y-auto h-[calc(100vh-5rem)]">

                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg>
                    <span class="font-medium">Dashboard</span>
                </a>
                
                <div class="pt-4 mt-4 border-t border-slate-900/15 dark:border-white/15">
                    <p class="px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Manajemen</p>
                    <a href="admin_siswa.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
                        <span class="font-medium">Data Siswa</span>

                    <a href="admin_guru.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" /></svg>
                        <span class="font-medium">Data Guru</span>
                    </a>
                    <a href="admin_import.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
                        <span class="font-medium">Manajemen Data</span>
                    </a>
                    <a href="admin_rekap.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary text-white shadow-md transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                        <span class="font-medium">Rekap Absensi</span>
                    </a>
                </div>
            </nav>
        </aside>

        <div x-show="sidebarOpen" x-cloak class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm md:hidden" @click="sidebarOpen = false"></div>

        <div class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="h-20 glass flex items-center justify-between px-6 z-30">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = !sidebarOpen" class="md:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" /></svg>
                    </button>
                    <h1 class="text-xl font-bold hidden sm:block font-serif">Rekap Absensi</h1>
                </div>

                <div class="flex items-center gap-4">
                    <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <svg x-show="!isDark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
                        <svg x-show="isDark" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-yellow-400"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
                    </button>
                    
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.away="open = false" class="flex items-center gap-3 p-1.5 rounded-full hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                            <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                                <span class="material-symbols-rounded text-xl">admin_panel_settings</span>
                            </div>
                        </button>
                        <div x-show="open" x-cloak class="absolute right-0 mt-2 w-48 bg-surface-lowest dark:bg-surface-dark-lowest rounded-2xl shadow-[0_24px_40px_-12px_rgba(0,0,0,0.06)] dark:shadow-[0_24px_40px_-12px_rgba(0,0,0,0.3)] py-2 z-50">
                            <div class="px-4 py-2 border-b border-slate-900/15 dark:border-white/15 mb-1">
                                <p class="text-sm font-medium">Administrator</p>
                                <p class="text-xs text-slate-500">Super Admin</p>
                            </div>
                            <button @click="window.location.href='admin_dashboard.html'" class="w-full flex items-center gap-2 text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
                                <span class="material-symbols-rounded text-lg">password</span> Ubah Sandi
                            </button>
                            <button @click="logout()" class="w-full flex items-center gap-2 text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors border-t border-slate-900/15 dark:border-white/15">
                                <span class="material-symbols-rounded text-lg">logout</span> Keluar
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-6">
                <!-- Filter Section -->
                <div class="bg-surface-lowest dark:bg-surface-dark-lowest rounded-3xl p-6 shadow-lg mb-8">
                    <h2 class="text-lg font-bold font-serif mb-4">Pilih Waktu Rekap</h2>
                    
                    <div class="flex bg-slate-200 dark:bg-slate-800 p-1 rounded-xl w-full sm:w-auto overflow-x-auto shadow-inner mb-6 inline-flex">
                        <button @click="filterMode = 'hari'" 
                            :class="filterMode === 'hari' ? 'bg-white dark:bg-slate-700 text-slate-800 dark:text-white shadow-sm font-semibold' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 font-medium'" 
                            class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm transition-all whitespace-nowrap">
                            Harian
                        </button>
                        <button @click="filterMode = 'minggu'" 
                            :class="filterMode === 'minggu' ? 'bg-white dark:bg-slate-700 text-slate-800 dark:text-white shadow-sm font-semibold' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 font-medium'" 
                            class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm transition-all whitespace-nowrap">
                            Mingguan
                        </button>
                        <button @click="filterMode = 'bulan'" 
                            :class="filterMode === 'bulan' ? 'bg-white dark:bg-slate-700 text-slate-800 dark:text-white shadow-sm font-semibold' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 font-medium'" 
                            class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm transition-all whitespace-nowrap">
                            Bulanan
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Mode Hari -->
                        <div x-show="filterMode === 'hari'" class="md:col-span-1">
                            <label class="block text-sm font-medium mb-1">Tanggal</label>
                            <input type="date" x-model="selectedDate" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-primary">
                        </div>

                        <!-- Mode Minggu -->
                        <div x-show="filterMode === 'minggu'" class="md:col-span-2 grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Bulan</label>
                                <input type="month" x-model="selectedMonth" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-primary">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Pilih Minggu</label>
                                <select x-model="selectedWeek" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-primary">
                                    <option value="1">Minggu ke-1 (Tgl 1-7)</option>
                                    <option value="2">Minggu ke-2 (Tgl 8-14)</option>
                                    <option value="3">Minggu ke-3 (Tgl 15-21)</option>
                                    <option value="4">Minggu ke-4 (Tgl 22-28)</option>
                                    <option value="5">Minggu ke-5 (Tgl 29-Akhir)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Mode Bulan -->
                        <div x-show="filterMode === 'bulan'" class="md:col-span-1">
                            <label class="block text-sm font-medium mb-1">Pilih Bulan</label>
                            <input type="month" x-model="selectedMonth" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-primary">
                        </div>
                    </div>

                    <!-- Additional Filters -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 pt-4 border-t border-slate-100 dark:border-slate-800">
                        <div>
                            <label class="block text-sm font-medium mb-1">Kelas</label>
                            <select x-model="filterKelas" @change="loadJurusan()" class="w-full bg-slate-50 dark:bg-slate-800 border rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-primary">
                                <option value="">-- Semua Kelas --</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Jurusan</label>
                            <select x-model="filterJurusan" :disabled="!filterKelas" class="w-full bg-slate-50 dark:bg-slate-800 border rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-primary">
                                <option value="">-- Semua Jurusan --</option>
                                <template x-for="j in jurusanList" :key="j.id">
                                    <option :value="j.nama" x-text="j.nama"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Status Kehadiran</label>
                            <select x-model="filterStatus" class="w-full bg-slate-50 dark:bg-slate-800 border rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-primary">
                                <option value="">-- Semua Status --</option>
                                <option value="hadir">Hadir</option>
                                <option value="alfa">Alfa</option>
                                <option value="sakit">Sakit</option>
                                <option value="izin">Izin</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-6 flex justify-end">
                        <div class="flex items-end">
                            <button @click="loadData()" :disabled="loading" class="w-full md:w-auto px-6 py-2 bg-primary hover:bg-blue-700 text-white rounded-xl font-medium transition-all disabled:opacity-50">
                                <span x-show="!loading">Tampilkan Data</span>
                                <span x-show="loading">Memuat...</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Data Table & Export -->
                <div x-show="dataLoaded" class="bg-surface-lowest dark:bg-surface-dark-lowest rounded-3xl shadow-lg overflow-hidden">
                    <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                        <h3 class="font-bold text-lg">Preview Data (<span x-text="records.length"></span>)</h3>
                        <button @click="exportExcel()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium transition-all flex items-center gap-2 text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                            Export Excel
                        </button>
                    </div>

                    <div class="overflow-x-auto max-h-[500px]">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-50 dark:bg-slate-800 sticky top-0">
                                <tr>
                                    <th class="px-6 py-3 font-semibold border-b">Nama Lengkap</th>
                                    <th class="px-6 py-3 font-semibold border-b">Kelas</th>
                                    <th class="px-6 py-3 font-semibold border-b">Jurusan</th>
                                    <th class="px-6 py-3 font-semibold border-b">Mapel</th>
                                    <th class="px-6 py-3 font-semibold border-b">Tanggal</th>
                                    <th class="px-6 py-3 font-semibold border-b">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                                <template x-if="records.length === 0">
                                    <tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">Tidak ada data untuk periode ini.</td></tr>
                                </template>
                                <template x-for="r in paginatedRecords()" :key="Math.random()">
                                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                        <td class="px-6 py-3" x-text="r.nama || '-'"></td>
                                        <td class="px-6 py-3" x-text="r.kelas || '-'"></td>
                                        <td class="px-6 py-3" x-text="r.jurusan || '-'"></td>
                                        <td class="px-6 py-3" x-text="r.mapel || '-'"></td>
                                        <td class="px-6 py-3" x-text="r.tanggal"></td>
                                        <td class="px-6 py-3 uppercase text-xs font-bold" :class="{'text-emerald-600': r.status==='hadir', 'text-rose-600': r.status==='alfa', 'text-amber-600': r.status==='izin' || r.status==='sakit'}" x-text="r.status"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination Controls -->
                    <div x-show="records.length > 0" class="px-6 py-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="text-sm text-slate-500">
                            Menampilkan <span class="font-semibold text-slate-900 dark:text-slate-200" x-text="records.length > 0 ? (currentPage - 1) * itemsPerPage + 1 : 0"></span> - <span class="font-semibold text-slate-900 dark:text-slate-200" x-text="Math.min(currentPage * itemsPerPage, records.length)"></span> dari <span class="font-semibold text-slate-900 dark:text-slate-200" x-text="records.length"></span> catatan
                        </div>
                        <div class="flex gap-2">
                            <button @click="prevPage()" :disabled="currentPage === 1"
                                class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                                Sebelumnya
                            </button>
                            <button @click="nextPage()" :disabled="currentPage >= totalPages()"
                                class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                                Selanjutnya
                            </button>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";
        import { doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '../index.html'; return; }
            if (!user.email.endsWith('@admin.absensi.id') && !user.email.endsWith('@operator.absensi.id')) { window.location.href = '../index.html'; return; }

            const userDoc = await getDoc(doc(db, 'users', user.uid));
            const adminData = userDoc.exists() ? userDoc.data() : { nama: 'Admin' };
            localStorage.setItem('user_name', adminData.nama);

            window.dispatchEvent(new CustomEvent('firebase-ready', { detail: adminData }));
        });

        window.firebaseLogout = async function() {
            await signOut(auth);
            localStorage.clear();
            window.location.href = '../index.html';
        };

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;

        window.fetchRekap = async function(mode, dateStr, monthStr, weekNum) {
            const presensiRef = collection(db, 'presensi_siswa');
            let q;

            if (mode === 'hari') {
                if(!dateStr) throw new Error("Pilih tanggal terlebih dahulu");
                q = query(presensiRef, where('tanggal', '==', dateStr));
            } else if (mode === 'minggu') {
                if(!monthStr) throw new Error("Pilih bulan terlebih dahulu");
                const year = parseInt(monthStr.split('-')[0]);
                const month = parseInt(monthStr.split('-')[1]);
                
                let startDay = 1, endDay = 7;
                if(weekNum == 1) { startDay = 1; endDay = 7; }
                else if(weekNum == 2) { startDay = 8; endDay = 14; }
                else if(weekNum == 3) { startDay = 15; endDay = 21; }
                else if(weekNum == 4) { startDay = 22; endDay = 28; }
                else if(weekNum == 5) { startDay = 29; endDay = 31; }

                const dStart = new Date(year, month - 1, startDay);
                const dEnd = new Date(year, month - 1, endDay);
                
                const startStr = new Date(dStart.getTime() - dStart.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                const endStr = new Date(dEnd.getTime() - dEnd.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                
                q = query(presensiRef, where('tanggal', '>=', startStr), where('tanggal', '<=', endStr));
            } else if (mode === 'bulan') {
                if(!monthStr) throw new Error("Pilih bulan terlebih dahulu");
                const year = parseInt(monthStr.split('-')[0]);
                const month = parseInt(monthStr.split('-')[1]);
                
                const dStart = new Date(year, month - 1, 1);
                const dEnd = new Date(year, month, 0); // Last day of the month
                
                const startStr = new Date(dStart.getTime() - dStart.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                const endStr = new Date(dEnd.getTime() - dEnd.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                
                q = query(presensiRef, where('tanggal', '>=', startStr), where('tanggal', '<=', endStr));
            }

            const snap = await getDocs(q);
            let data = [];
            snap.forEach(d => {
                data.push(d.data());
            });
            return data.sort((a,b) => a.nama.localeCompare(b.nama));
        };
    </script>

    <script>
        function adminRekap() {
            return {
                isDark: false,
                sidebarOpen: window.innerWidth >= 768,
                userName: '',
                loading: false,
                dataLoaded: false,
                
                filterMode: 'hari',
                selectedDate: new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0],
                selectedMonth: new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0,7),
                selectedWeek: '1',
                
                filterKelas: '',
                filterJurusan: '',
                filterStatus: '',
                jurusanList: [],
                
                records: [],
                currentPage: 1,
                itemsPerPage: 15,

                initRekap() {
                    this.userName = localStorage.getItem('user_name') || 'Admin';
                    ThemeUtil.init(this);
                    window.addEventListener('firebase-ready', (e) => {
                        this.userName = e.detail.nama || 'Admin';
                    });
                },

                toggleTheme() {
                    ThemeUtil.toggle(this);
                },

                logout() {
                    if (window.firebaseLogout) window.firebaseLogout();
                },

                async loadData() {
                    this.loading = true;
                    try {
                        const rawRecords = await window.fetchRekap(this.filterMode, this.selectedDate, this.selectedMonth, this.selectedWeek);
                        
                        // Client-side filtering to avoid complex composite indexes on Firestore
                        this.records = rawRecords.filter(r => {
                            const matchKelas = this.filterKelas ? r.kelas === this.filterKelas : true;
                            const matchJurusan = this.filterJurusan ? r.jurusan === this.filterJurusan : true;
                            const matchStatus = this.filterStatus ? r.status === this.filterStatus : true;
                            return matchKelas && matchJurusan && matchStatus;
                        });

                        this.currentPage = 1; // Reset pagination when new data is loaded
                        this.dataLoaded = true;
                    } catch(e) {
                        alert(e.message);
                    }
                    this.loading = false;
                },

                async loadJurusan() {
                    this.filterJurusan = '';
                    if (!this.filterKelas) { this.jurusanList = []; return; }
                    try {
                        const snap = await window.getDocs(window.collection(window.db, 'jurusan'));
                        let jList = [];
                        snap.forEach(d => jList.push({ id: d.id, ...d.data() }));
                        this.jurusanList = jList.sort((a,b) => a.nama.localeCompare(b.nama));
                    } catch(e) { console.error(e); }
                },

                // Pagination Methods
                paginatedRecords() {
                    const start = (this.currentPage - 1) * this.itemsPerPage;
                    return this.records.slice(start, start + this.itemsPerPage);
                },
                totalPages() {
                    return Math.ceil(this.records.length / this.itemsPerPage) || 1;
                },
                nextPage() {
                    if (this.currentPage < this.totalPages()) this.currentPage++;
                },
                prevPage() {
                    if (this.currentPage > 1) this.currentPage--;
                },

                exportExcel() {
                    if(this.records.length === 0) return;
                    
                    const exportData = this.records.map(r => ({
                        'Nama Lengkap': r.nama || '-',
                        'Kelas': r.kelas || '-',
                        'Jurusan': r.jurusan || '-',
                        'Mapel': r.mapel || '-',
                        'Tanggal': r.tanggal,
                        'Waktu Presensi': r.waktu_masuk && r.waktu_masuk.toDate ? r.waktu_masuk.toDate().toLocaleTimeString('id-ID') : '-',
                        'Status': r.status.toUpperCase(),
                        'Metode': r.scan_method === 'qr' ? 'QR Code' : 'Manual'
                    }));

                    const ws = XLSX.utils.json_to_sheet(exportData);
                    ws['!cols'] = [{wch:30}, {wch:15}, {wch:20}, {wch:25}, {wch:15}, {wch:15}, {wch:15}, {wch:15}];
                    
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Rekap Absensi");
                    
                    let filename = "Rekap_Absensi_";
                    if(this.filterMode === 'hari') filename += this.selectedDate;
                    else if(this.filterMode === 'minggu') filename += `${this.selectedMonth}_M${this.selectedWeek}`;
                    else if(this.filterMode === 'bulan') filename += `${this.selectedMonth}`;
                    
                    XLSX.writeFile(wb, filename + ".xlsx");
                }
            }
        }
    </script>
