<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Data Guru - Sistem Absensi">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <title>Data Guru - Sistem Absensi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="../shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="../shared/styles.css">
    <script src="../shared/theme.js"></script>
</head>
<body class="bg-surface-dim dark:bg-surface-dark-dim text-slate-900 dark:text-slate-200 transition-colors duration-300 min-h-screen"
    x-data="adminGuru()" x-init="initGuru()">

    <!-- Toast Notification -->
    <div x-show="toast.show" x-cloak
        x-transition:enter="transition ease-out duration-300 transform"
        x-transition:enter-start="opacity-0 translate-x-8"
        x-transition:enter-end="opacity-100 translate-x-0"
        x-transition:leave="transition ease-in duration-200 transform"
        x-transition:leave-start="opacity-100 translate-x-0"
        x-transition:leave-end="opacity-0 translate-x-8"
        class="fixed top-6 right-6 z-[100] flex items-center p-4 mb-4 text-slate-800 bg-white rounded-xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.15)] dark:text-slate-200 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 max-w-sm w-full"
        role="alert">
        <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg"
            :class="toast.type === 'success' ? 'text-emerald-500 bg-emerald-100 dark:bg-emerald-900/30 dark:text-emerald-400' : 'text-red-500 bg-red-100 dark:bg-red-900/30 dark:text-red-400'">
            <span class="material-symbols-rounded text-xl" x-text="toast.type === 'success' ? 'check_circle' : 'error'"></span>
        </div>
        <div class="ms-3 text-sm font-medium pr-4" x-text="toast.message"></div>
        <button type="button" @click="toast.show = false"
            class="ms-auto -mx-1.5 -my-1.5 bg-white text-slate-400 hover:text-slate-900 rounded-lg focus:ring-2 focus:ring-slate-300 p-1.5 hover:bg-slate-100 inline-flex items-center justify-center h-8 w-8 dark:text-slate-500 dark:hover:text-white dark:bg-slate-800 dark:hover:bg-slate-700">
            <span class="material-symbols-rounded text-lg">close</span>
        </button>
    </div>

    <div class="flex h-screen overflow-hidden">
        <aside class="fixed inset-y-0 left-0 z-50 w-64 glass shadow-[0_24px_40px_-12px_rgba(0,0,0,0.06)] dark:shadow-[0_24px_40px_-12px_rgba(0,0,0,0.3)] transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
            :class="{'translate-x-0': sidebarOpen, '-translate-x-full': !sidebarOpen}">
            <div class="flex items-center justify-between h-20 px-6 border-b border-slate-900/15 dark:border-white/15">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary to-primary text-white flex items-center justify-center shadow-lg shadow-primary/20">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z" /></svg>
                    </div>
                    <span class="font-bold text-lg tracking-tight">AdminPanel</span>
                </div>
                <button @click="sidebarOpen = false" class="md:hidden text-slate-500 hover:text-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <nav class="p-4 space-y-2 overflow-y-auto h-[calc(100vh-5rem)]">
                <a href="admin_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg>
                    <span class="font-medium">Dashboard</span>
                </a>
                <div class="pt-4 mt-4 border-t border-slate-900/15 dark:border-white/15">
                    <p class="px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Manajemen</p>
                    <a href="admin_siswa.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
                        <span class="font-medium">Data Siswa</span>
                    </a>
                    <a href="admin_guru.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary text-white shadow-md shadow-primary/20 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" /></svg>
                        <span class="font-medium">Data Guru</span>
                    </a>
                    <a href="admin_import.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
                        <span class="font-medium">Manajemen Data</span>
                    </a>
                    <a href="admin_rekap.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                        <span class="font-medium">Rekap Absensi</span>
                    </a>
                </div>
            </nav>
        </aside>
        <div x-show="sidebarOpen" x-cloak class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm md:hidden" @click="sidebarOpen = false"></div>
        <div class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="h-20 glass flex items-center justify-between px-6 z-30">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = !sidebarOpen" class="md:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" /></svg>
                    </button>
                    <h1 class="text-xl font-bold hidden sm:block font-serif">Data Guru</h1>
                </div>
                <div class="flex items-center gap-4">
                    <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <svg x-show="!isDark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
                        <svg x-show="isDark" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-yellow-400"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
                    </button>
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.away="open = false" class="flex items-center gap-3 p-1.5 rounded-full hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                            <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                                <span class="material-symbols-rounded text-xl">admin_panel_settings</span>
                            </div>
                        </button>
                        <div x-show="open" x-cloak class="absolute right-0 mt-2 w-48 bg-surface-lowest dark:bg-surface-dark-lowest rounded-2xl shadow-[0_24px_40px_-12px_rgba(0,0,0,0.06)] dark:shadow-[0_24px_40px_-12px_rgba(0,0,0,0.3)] py-2 z-50">
                            <div class="px-4 py-2 border-b border-slate-900/15 dark:border-white/15 mb-1">
                                <p class="text-sm font-medium">Administrator</p>
                                <p class="text-xs text-slate-500">Super Admin</p>
                            </div>
                            <button @click="window.location.href='admin_dashboard.html'" class="w-full flex items-center gap-2 text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
                                <span class="material-symbols-rounded text-lg">password</span> Ubah Sandi
                            </button>
                            <button @click="logout()" class="w-full flex items-center gap-2 text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors border-t border-slate-900/15 dark:border-white/15">
                                <span class="material-symbols-rounded text-lg">logout</span> Keluar
                            </button>
                        </div>
                    </div>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto p-6">
                <!-- Form Input Nomor WA -->
                <div class="flex flex-col md:flex-row gap-4 items-end md:items-center justify-between mb-8 bg-surface-lowest dark:bg-surface-dark-lowest rounded-3xl p-6 shadow-lg shadow-slate-200/30 dark:shadow-black/20">
                    <div class="flex flex-wrap items-end gap-4 w-full">
                        <div class="flex-1 min-w-[180px]">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Guru</label>
                            <div x-show="!showCustomName">
                                <select x-model="waForm.nama" @change="if(waForm.nama==='__custom__'){showCustomName=true;waForm.nama='';}"
                                    class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary outline-none transition-all">
                                    <option value="">-- Pilih Guru --</option>
                                    <template x-for="g in guru" :key="g.id">
                                        <option :value="g.nama" x-text="g.nama"></option>
                                    </template>
                                    <option value="__custom__">✏️ Masukkan nama lain...</option>
                                </select>
                            </div>
                            <div x-show="showCustomName" class="flex gap-2">
                                <input type="text" x-model="waForm.nama" placeholder="Ketik nama guru..."
                                    class="flex-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary outline-none transition-all">
                                <button @click="showCustomName=false;waForm.nama=''" class="px-3 py-2 text-xs bg-slate-200 dark:bg-slate-700 rounded-xl hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors">Pilih</button>
                            </div>
                        </div>
                        <div class="flex-1 min-w-[150px]">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">No HP / WhatsApp</label>
                            <input type="text" x-model="waForm.no_hp" placeholder="628xxxx"
                                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary outline-none transition-all">
                        </div>
                        <div class="flex-1 min-w-[150px]">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Jabatan</label>
                            <input type="text" x-model="waForm.jabatan" placeholder="Wali Kelas, dll"
                                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary outline-none transition-all">
                        </div>
                        <div class="flex-shrink-0">
                            <button @click="submitWaNumber()" :disabled="savingWa"
                                class="px-6 py-2.5 bg-primary hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                                <span x-show="!savingWa">Simpan Nomor</span>
                                <span x-show="savingWa">Menyimpan...</span>
                            </button>
                        </div>
                    </div>
                </div>
                <!-- Status message -->
                <!-- Saved WA Numbers -->
                <div x-show="waNumbers.length > 0" class="mb-8 bg-surface-lowest dark:bg-surface-dark-lowest rounded-3xl shadow-lg shadow-slate-200/30 dark:shadow-black/20 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700">
                        <h3 class="font-bold text-sm text-slate-500 uppercase tracking-wider">Nomor WhatsApp Tersimpan</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50/50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700 text-sm">
                                    <th class="px-6 py-3 font-semibold">Nama</th>
                                    <th class="px-6 py-3 font-semibold">No HP</th>
                                    <th class="px-6 py-3 font-semibold">Jabatan</th>
                                    <th class="px-6 py-3 font-semibold text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                <template x-for="(item, idx) in waNumbers" :key="idx">
                                    <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-colors">
                                        <td class="px-6 py-3 font-medium text-sm" x-text="item.nama"></td>
                                        <td class="px-6 py-3 text-sm text-slate-500" x-text="item.no_hp"></td>
                                        <td class="px-6 py-3 text-sm" x-text="item.jabatan || '-'"></td>
                                        <td class="px-6 py-3 text-center">
                                            <button @click="openEditWaModal(idx)" class="p-1.5 bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/20 dark:hover:bg-blue-900/40 rounded-lg text-blue-500 transition-colors" title="Edit">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.127l-3.196 1.042 1.042-3.196a4.5 4.5 0 011.127-1.89l12.927-12.927z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 7.125L16.875 4.5" /></svg>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- Data Table Guru -->
                <div class="bg-surface-lowest dark:bg-surface-dark-lowest rounded-3xl shadow-lg shadow-slate-200/30 dark:shadow-black/20 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50/50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700 text-sm">
                                    <th class="px-6 py-4 font-semibold">Nama Lengkap</th>
                                    <th class="px-6 py-4 font-semibold">Username</th>
                                    <th class="px-6 py-4 font-semibold">Jenis Kelamin</th>
                                    <th class="px-6 py-4 font-semibold text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                <template x-if="filteredGuru.length === 0">
                                    <tr>
                                        <td colspan="3" class="px-6 py-8 text-center text-slate-500">
                                            <span x-show="loading">Memuat data...</span>
                                            <span x-show="!loading">Tidak ada data guru ditemukan.</span>
                                        </td>
                                    </tr>
                                </template>
                                <template x-for="g in paginatedGuru()" :key="g.id">
                                    <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-colors">
                                        <td class="px-6 py-4"><div class="font-medium" x-text="g.nama || '-'"></div></td>
                                        <td class="px-6 py-4 text-sm text-slate-500" x-text="g.username || '-'"></td>
                                        <td class="px-6 py-4 text-sm" x-text="g.jenis_kelamin || '-'"></td>
                                        <td class="px-6 py-4 text-center flex items-center justify-center gap-2">
                                            <button @click="resetPassword(g)"
                                                class="p-2 bg-amber-100 hover:bg-amber-200 dark:bg-amber-900/30 dark:hover:bg-amber-900/50 rounded-lg text-amber-600 dark:text-amber-400 transition-colors"
                                                title="Reset Sandi ke 123456">
                                                <span class="material-symbols-rounded text-base">lock_reset</span>
                                            </button>
                                            <button @click="deleteGuru(g)"
                                                class="p-2 bg-red-100 hover:bg-red-200 dark:bg-red-900/30 dark:hover:bg-red-900/50 rounded-lg text-red-600 dark:text-red-400 transition-colors"
                                                title="Hapus Guru">
                                                <span class="material-symbols-rounded text-base">delete</span>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="text-sm text-slate-500">
                            Menampilkan <span class="font-semibold text-slate-900 dark:text-slate-200" x-text="filteredGuru.length > 0 ? (currentPage - 1) * itemsPerPage + 1 : 0"></span> -
                            <span class="font-semibold text-slate-900 dark:text-slate-200" x-text="Math.min(currentPage * itemsPerPage, filteredGuru.length)"></span> dari
                            <span class="font-semibold text-slate-900 dark:text-slate-200" x-text="filteredGuru.length"></span> guru
                        </div>
                        <div class="flex gap-2">
                            <button @click="prevPage()" :disabled="currentPage === 1"
                                class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Sebelumnya</button>
                            <button @click="nextPage()" :disabled="currentPage >= totalPages()"
                                class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Selanjutnya</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Edit WA -->
    <div x-show="editWaModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm" x-cloak>
        <div @click.away="editWaModal = false" class="bg-surface-lowest dark:bg-surface-dark-lowest rounded-3xl shadow-xl w-full max-w-md overflow-hidden"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-95">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-lg">Edit Nomor WhatsApp</h3>
                <button @click="editWaModal = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-500 mb-1">Nama Guru</label>
                    <input type="text" x-model="editWaForm.nama" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-500 mb-1">No HP / WhatsApp</label>
                    <input type="text" x-model="editWaForm.no_hp" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-500 mb-1">Jabatan</label>
                    <input type="text" x-model="editWaForm.jabatan" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-primary outline-none transition-all">
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 flex justify-between items-center">
                <button @click="deleteWaNumber(editWaIdx); editWaModal = false;" class="px-4 py-2 bg-red-100 text-red-600 hover:bg-red-200 dark:bg-red-900/30 dark:hover:bg-red-900/50 dark:text-red-400 rounded-xl text-sm font-medium transition-colors">
                    Hapus
                </button>
                <div class="flex gap-2">
                    <button @click="editWaModal = false" class="px-4 py-2 bg-slate-200 text-slate-700 hover:bg-slate-300 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600 rounded-xl text-sm font-medium transition-colors">
                        Batal
                    </button>
                    <button @click="saveEditWa()" :disabled="savingWa" class="px-4 py-2 bg-primary hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition-colors disabled:opacity-50 flex items-center gap-2">
                        <span x-show="!savingWa">Simpan</span>
                        <span x-show="savingWa">Menyimpan...</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { auth, db } from '../firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";
        import { doc, getDoc, setDoc, collection, getDocs, query, where, deleteDoc } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '../index.html'; return; }
            if (!user.email.endsWith('@admin.absensi.id') && !user.email.endsWith('@operator.absensi.id')) { window.location.href = '../index.html'; return; }

            const userDoc = await getDoc(doc(db, 'users', user.uid));
            const adminData = userDoc.exists() ? userDoc.data() : { nama: 'Admin' };
            localStorage.setItem('user_name', adminData.nama);

            try {
                const guruSnap = await getDocs(query(collection(db, 'users'), where('role', '==', 'guru')));
                const guruData = [];
                guruSnap.forEach(d => { guruData.push({ id: d.id, ...d.data() }); });

                // Load saved WA numbers
                let waNumbers = [];
                try {
                    const waDoc = await getDoc(doc(db, 'settings', 'whatsapp_numbers'));
                    if (waDoc.exists() && waDoc.data().numbers) { waNumbers = waDoc.data().numbers; }
                } catch (e) { console.error('Error loading WA numbers:', e); }

                window.dispatchEvent(new CustomEvent('firebase-guru-ready', {
                    detail: {
                        nama: adminData.nama,
                        guru: guruData.sort((a, b) => (a.nama || '').localeCompare(b.nama || '')),
                        waNumbers: waNumbers
                    }
                }));
            } catch (e) {
                console.error('Gagal fetch guru:', e);
                window.dispatchEvent(new CustomEvent('firebase-guru-ready', { detail: { nama: adminData.nama, guru: [], waNumbers: [] } }));
            }
        });

        window.firebaseLogout = async function () {
            await signOut(auth);
            localStorage.clear();
            window.location.href = '../index.html';
        };

        window.getAuthToken = async function() {
            if (!auth.currentUser) return null;
            return await auth.currentUser.getIdToken(true);
        };

        window.firebaseSaveWaNumbers = async function (numbers) {
            await setDoc(doc(db, 'settings', 'whatsapp_numbers'), {
                numbers: numbers,
                updated_at: new Date()
            });
        };

        window.firebaseDeleteGuru = async function (id) {
            await deleteDoc(doc(db, 'users', id));
        };
    </script>
    <script>
        function adminGuru() {
            return {
                isDark: false,
                sidebarOpen: window.innerWidth >= 768,
                userName: '',
                loading: true,
                guru: [],
                currentPage: 1,
                itemsPerPage: 15,
                searchQuery: '',
                // WA Form
                waForm: { nama: '', no_hp: '', jabatan: '' },
                showCustomName: false,
                savingWa: false,
                waNumbers: [],
                
                editWaModal: false,
                editWaIdx: -1,
                editWaForm: { nama: '', no_hp: '', jabatan: '' },

                toast: { show: false, message: '', type: 'success', timeoutId: null },
                showToast(message, type = 'success') {
                    this.toast.message = message;
                    this.toast.type = type;
                    this.toast.show = true;
                    if (this.toast.timeoutId) clearTimeout(this.toast.timeoutId);
                    this.toast.timeoutId = setTimeout(() => { this.toast.show = false; }, 5000);
                },

                initGuru() {
                    this.userName = localStorage.getItem('user_name') || 'Admin';
                    ThemeUtil.init(this);
                    window.addEventListener('firebase-guru-ready', (e) => {
                        this.userName = e.detail.nama || 'Admin';
                        this.guru = e.detail.guru || [];
                        this.waNumbers = e.detail.waNumbers || [];
                        this.loading = false;
                    });
                },

                get filteredGuru() {
                    if (!this.searchQuery) return this.guru;
                    const q = this.searchQuery.toLowerCase();
                    return this.guru.filter(g =>
                        (g.nama && g.nama.toLowerCase().includes(q)) ||
                        (g.username && g.username.toLowerCase().includes(q))
                    );
                },

                paginatedGuru() {
                    const start = (this.currentPage - 1) * this.itemsPerPage;
                    return this.filteredGuru.slice(start, start + this.itemsPerPage);
                },
                totalPages() { return Math.ceil(this.filteredGuru.length / this.itemsPerPage) || 1; },
                nextPage() { if (this.currentPage < this.totalPages()) this.currentPage++; },
                prevPage() { if (this.currentPage > 1) this.currentPage--; },

                async submitWaNumber() {
                    if (!this.waForm.nama || !this.waForm.no_hp) {
                        this.showToast('Nama dan No HP wajib diisi.', 'error');
                        return;
                    }
                    this.savingWa = true;
                    try {
                        const newEntry = {
                            nama: this.waForm.nama,
                            no_hp: this.waForm.no_hp,
                            jabatan: this.waForm.jabatan || ''
                        };
                        this.waNumbers.push(newEntry);
                        await window.firebaseSaveWaNumbers(this.waNumbers);
                        this.showToast('Nomor WhatsApp berhasil disimpan!', 'success');
                        this.waForm = { nama: '', no_hp: '', jabatan: '' };
                        this.showCustomName = false;
                    } catch (e) {
                        this.showToast('Gagal menyimpan: ' + e.message, 'error');
                    }
                    this.savingWa = false;
                },

                openEditWaModal(idx) {
                    this.editWaIdx = idx;
                    const item = this.waNumbers[idx];
                    this.editWaForm = { nama: item.nama, no_hp: item.no_hp, jabatan: item.jabatan || '' };
                    this.editWaModal = true;
                },
                
                async saveEditWa() {
                    if (!this.editWaForm.nama || !this.editWaForm.no_hp) {
                        this.showToast('Nama dan No HP wajib diisi.', 'error');
                        return;
                    }
                    this.savingWa = true;
                    try {
                        this.waNumbers[this.editWaIdx] = { ...this.editWaForm };
                        await window.firebaseSaveWaNumbers(this.waNumbers);
                        this.showToast('Nomor WhatsApp berhasil diperbarui!', 'success');
                        this.editWaModal = false;
                    } catch (e) {
                        this.showToast('Gagal memperbarui: ' + e.message, 'error');
                    }
                    this.savingWa = false;
                },

                async deleteWaNumber(idx) {
                    if (!confirm('Hapus nomor ini?')) return;
                    this.waNumbers.splice(idx, 1);
                    try {
                        await window.firebaseSaveWaNumbers(this.waNumbers);
                        this.showToast('Nomor berhasil dihapus.', 'success');
                    } catch (e) {
                        this.showToast('Gagal menghapus: ' + e.message, 'error');
                    }
                },

                toggleTheme() { ThemeUtil.toggle(this); },

                async deleteGuru(guru) {
                    if (!confirm(`Yakin ingin menghapus guru ${guru.nama}?`)) return;
                    try {
                        if (window.firebaseDeleteGuru) {
                            await window.firebaseDeleteGuru(guru.id);
                            this.guru = this.guru.filter(g => g.id !== guru.id);
                            this.showToast('Guru berhasil dihapus dari data.', 'success');
                        }
                    } catch(e) {
                        this.showToast('Gagal menghapus guru: ' + e.message, 'error');
                    }
                },
                
                async resetPassword(guru) {
                    if (!confirm(`Yakin ingin me-reset sandi Guru atas nama ${guru.nama} kembali menjadi '123456'?`)) return;
                    
                    this.showToast('Memproses reset sandi...', 'success');
                    try {
                        const token = await window.getAuthToken();
                        if (!token) throw new Error("Anda harus login ulang.");

                        const res = await fetch('/api/reset-password', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + token
                            },
                            body: JSON.stringify({ targetUid: guru.id })
                        });
                        
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.message || "Gagal mereset sandi.");
                        
                        this.showToast('Sandi berhasil direset menjadi 123456', 'success');
                    } catch (error) {
                        this.showToast('Gagal: ' + error.message, 'error');
                    }
                },

                logout() { if (window.firebaseLogout) window.firebaseLogout(); }
            }
        }
    </script>
</body>
</html>
